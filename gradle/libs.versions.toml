[versions]
# Android & Build Tools
buildGradle = "8.11.0"
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"
compileSdk = "35"
minSdk = "23"
targetSdk = "35"
versionCode = "10"
versionName = "1.1.0"

# Google Services
googleService = "4.4.3"
hilt = "2.56.2"
hiltViewmodel = "1.2.0"

# Navigation
navigation = "2.9.1"
navSafeargsPlugin = "2.9.1"

# AndroidX Core
appcompat = "1.7.1"
coreKtx = "1.16.0"
constraintlayout = "2.2.1"
material = "1.12.0"
activity = "1.10.1"
fragment = "1.8.8"
legacySupport = "1.0.0"
recyclerview = "1.4.0"
viewpager2 = "1.1.0"
swipeRefreshLayout = "1.1.0"

# Lifecycle
lifecycle = "2.9.1"

# Room
room = "2.7.2"

# Startup
startup = "1.2.0"

# Coroutines
coroutines = "1.10.2"

# Networking
retrofit = "3.0.0"
gson = "2.13.1"
okhttp3 = "5.0.0"

# Debug & Tools
timber = "5.0.1"
stetho = "1.6.0"
sentry = "8.16.0"
sentryGradle = "5.8.0"
leakcanary = "2.14"
klint = "1.0.1"

# Testing
junit = "4.13.2"
junitExt = "1.2.1"
espresso = "3.6.1"
test = "1.6.1"

# Other
coil = "2.7.0"
admob = "24.4.0"
r8 = "8.11.18"
detektGradle = "1.23.8"
work = "2.10.0"
desugaring = "2.1.5"

[libraries]
# Build Plugins (for buildscript classpath)
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "buildGradle" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
google-services = { module = "com.google.gms:google-services", version.ref = "googleService" }
hilt-android-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
navigation-safe-args-gradle-plugin = { module = "androidx.navigation:navigation-safe-args-gradle-plugin", version.ref = "navSafeargsPlugin" }
sentry-gradle-plugin = { module = "io.sentry:sentry-android-gradle-plugin", version.ref = "sentryGradle" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detektGradle" }
r8 = { module = "com.android.tools:r8", version.ref = "r8" }

# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# AndroidX Core
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-legacy-support-v4 = { module = "androidx.legacy:legacy-support-v4", version.ref = "legacySupport" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }

# Material Design
material = { module = "com.google.android.material:material", version.ref = "material" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }

# Startup
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startup" }

# Navigation
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }

# Room
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# Networking
retrofit2-retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit2-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp3-okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp3" }
okhttp3-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp3" }

# Dependency Injection
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

# Image Loading
coil = { module = "io.coil-kt:coil", version.ref = "coil" }

# Admob
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "admob" }

# Debug & Tools
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
stetho = { module = "com.facebook.stetho:stetho", version.ref = "stetho" }
stetho-okhttp3 = { module = "com.facebook.stetho:stetho-okhttp3", version.ref = "stetho" }
sentry-android = { module = "io.sentry:sentry-android", version.ref = "sentry" }
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "junitExt" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# Linting
ktlint = { module = "com.pinterest:ktlint", version.ref = "klint" }

# Desugaring
android-desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugaring" }

[plugins]
android-application = { id = "com.android.application", version.ref = "buildGradle" }
android-library = { id = "com.android.library", version.ref = "buildGradle" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
navigation-safeargs-kotlin = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleService" }
sentry = { id = "io.sentry.android.gradle", version.ref = "sentryGradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detektGradle" }

[bundles]
# AndroidX Core Bundle
androidx-core = [
    "androidx-appcompat",
    "androidx-core-ktx", 
    "androidx-constraintlayout",
    "androidx-activity",
    "androidx-activity-ktx",
    "androidx-legacy-support-v4",
    "androidx-recyclerview", 
    "androidx-viewpager2",
    "material"
]

# Lifecycle Bundle
lifecycle = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-viewmodel-ktx", 
    "androidx-lifecycle-livedata-ktx"
]

# Navigation Bundle
navigation = [
    "androidx-navigation-fragment-ktx",
    "androidx-navigation-ui",
    "androidx-navigation-ui-ktx"
]

# Room Bundle
room = [
    "androidx-room-runtime",
    "androidx-room-ktx"
]

# Networking Bundle
networking = [
    "retrofit2-retrofit",
    "retrofit2-converter-gson",
    "gson",
    "okhttp3-okhttp",
    "okhttp3-logging-interceptor"
]

# Coroutines Bundle
coroutines = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android"
]

# Debug Bundle
debug = [
    "timber",
    "stetho",
    "stetho-okhttp3",
    "sentry-android"
]

# Testing Bundle
testing = [
    "junit",
    "androidx-test-ext-junit",
    "androidx-test-espresso-core"
]
