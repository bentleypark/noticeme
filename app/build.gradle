plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.github.ben-manes.versions' version "0.52.0"
//    id 'io.sentry.android.gradle'
    id "org.gradle.android.cache-fix" version "3.0.1" apply false
}

//apply from: "${rootProject.projectDir}/flavors.gradle"

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    namespace "com.project.noticeme"
    compileSdk libs.versions.compileSdk.get().toInteger()
    
    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode libs.versions.versionCode.get().toInteger()
        versionName libs.versions.versionName.get()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndkVersion '27.0.12077973'
        ndk {
            debugSymbolLevel 'SYMBOL_TABLE'
            debugSymbolLevel 'FULL'
        }
    }
    
    signingConfigs {
        config {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }
    
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [environment: "production"]
            applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "noticeme-${variant.versionName}.apk"
                }
            }
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [environment: "staging"]
        }
    }

//    with flavorConfig

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
//        dataBinding = true
        viewBinding = true
        buildConfig = true
    }
    
    lintOptions {
        abortOnError false
        disable 'UnsafeExperimentalUsageError', 'UnsafeExperimentalUsageWarning', 'ContentDescription'
    }
    
    configurations {
        ktlint
    }
    
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
    
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude("META-INF/*.kotlin_module")
    }
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.incremental', 'true')
    arg('room.expandProjection', 'true')
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':common:ui')
    implementation project(':common:utils')
    implementation project(':data')

    // Kotlin
    implementation libs.kotlin.stdlib

    // Coroutines
    implementation libs.bundles.coroutines

    // AndroidX Core
    implementation libs.bundles.androidx.core

    // Lifecycle
    implementation libs.bundles.lifecycle

    // Startup
    implementation libs.androidx.startup.runtime
    
    // Navigation
    implementation libs.bundles.navigation

    // Networking
    implementation libs.bundles.networking

    // Dependency Injection
    implementation libs.hilt.android
    ksp libs.hilt.android.compiler

    // Room
    implementation libs.bundles.room
    ksp libs.androidx.room.compiler

    // Image Loading
    implementation libs.coil

    // Debug & Tools
    implementation libs.bundles.debug

    // Admob
    implementation libs.play.services.ads

    // Linting
    ktlint libs.ktlint

    // Testing
    testImplementation libs.bundles.testing
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core

    // Desugaring
    coreLibraryDesugaring libs.android.desugar.jdk.libs
}

def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

dependencyUpdates {
    rejectVersionIf {
        isNonStable(it.candidate.version)
    }
}

subprojects {
    apply plugin: "org.gradle.android.cache-fix"
}

